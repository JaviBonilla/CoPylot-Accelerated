name: Build Windows and macOS CPU packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows-x86_64, python-arch: x64 }
          - { runner: macos-15-intel, platform: macos-x86_64, python-arch: x64 }
          - { runner: macos-15, platform: macos-arm64, python-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Install build tools
        run: python -m pip install cmake==3.30.5 ninja==1.11.1.4
      - name: Compile, package and verify structure
        run: >-
          python scripts/native_package.py build
          --platform ${{ matrix.platform }}
          --revision ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
      - name: Upload the checked archive, checksum and build identity
        uses: actions/upload-artifact@v4
        with:
          name: hermite-optics-cpu-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-package/artifact/
          if-no-files-found: error
          compression-level: 0
