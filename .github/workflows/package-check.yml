name: Check native CPU packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install tools and reconstruct pinned dependencies
        run: |
          python -m pip install cmake==3.30.5 ninja -r requirements.txt
          python scripts/bootstrap.py
      - name: Configure on Linux or Intel macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          platform_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            platform_args+=(-DCMAKE_OSX_ARCHITECTURES=x86_64)
          fi
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCOPILOT_LOCAL_PACKAGE=ON \
            -DSOLARPILOT_ENABLE_FLUX_DIAGNOSTICS=ON "${platform_args[@]}"
      - name: Configure on Windows with MSVC x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio 2022 x64 tools are required" }
          $toolset = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "$vs\VC\Tools\MSVC\$toolset\bin\Hostx64\x64" >> $env:GITHUB_PATH
          cmake -S . -B build/package -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=OFF -DCOPILOT_LOCAL_PACKAGE=ON `
            -DSOLARPILOT_ENABLE_FLUX_DIAGNOSTICS=ON
      - name: Build, package and verify locally
        shell: bash
        run: |
          cmake --build build/package --target solarpilot --config Release --parallel 4
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          cpack --config build/package/CPackConfig.cmake -C Release
          archive=(build/package/packages/hermite-optics-local-*)
          test "${#archive[@]}" -eq 1
          python scripts/verify_package.py "${archive[0]}"
