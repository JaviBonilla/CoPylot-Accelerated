name: Validate Windows and macOS CPU package artifacts

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of the successful Windows and macOS package build
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
      attempt: ${{ steps.build.outputs.attempt }}
      revision: ${{ steps.build.outputs.revision }}
    steps:
      - name: Identify the selected build run and attempt
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if ! [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected a numeric build run ID" >&2
            exit 1
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          jq -e --arg id "$BUILD_RUN_ID" --arg repo "$GITHUB_REPOSITORY" '
            (.id | tostring) == $id and .head_repository.full_name == $repo
            and (.path | split("@")[0]) == ".github/workflows/package-check.yml"
            and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"
            and (.head_sha | test("^[0-9a-f]{40}$")) and .run_attempt >= 1
          ' <<<"$run" >/dev/null
          echo "run_id=$BUILD_RUN_ID" >>"$GITHUB_OUTPUT"
          jq -er '"attempt=\(.run_attempt)", "revision=\(.head_sha)"' <<<"$run" >>"$GITHUB_OUTPUT"

  native:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows-x86_64, python-arch: x64 }
          - { runner: macos-15-intel, platform: macos-x86_64, python-arch: x64 }
          - { runner: macos-15, platform: macos-arm64, python-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Download only this platform's artifact from the selected attempt
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          name: hermite-optics-cpu-${{ matrix.platform }}-${{ needs.resolve.outputs.run_id }}-${{ needs.resolve.outputs.attempt }}
          path: build/selected-artifact
      - name: Install smoke-test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Validate the downloaded binary without rebuilding
        env:
          BUILD_REVISION: ${{ needs.resolve.outputs.revision }}
          BUILD_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          BUILD_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
        shell: bash
        run: |
          python scripts/native_package.py validate \
            --platform ${{ matrix.platform }} --directory build/selected-artifact \
            --revision "$BUILD_REVISION" --run-id "$BUILD_RUN_ID" --run-attempt "$BUILD_ATTEMPT"
