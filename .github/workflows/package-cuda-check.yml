name: Check Linux CUDA package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cuda:
    # Use an isolated, disposable runner for trusted refs only.
    runs-on: [self-hosted, linux, x64, cuda-13-0]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install tools and reconstruct pinned dependencies
        run: |
          python -m pip install cmake==3.30.5 ninja -r requirements.txt
          nvcc --version | grep -E 'release 13\.0,'
          python scripts/bootstrap.py
      - name: Build, package and verify without submitting GPU work
        run: |
          cmake -S . -B build/package-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCOPILOT_LOCAL_PACKAGE=ON \
            -DSOLARPILOT_ENABLE_FLUX_DIAGNOSTICS=ON \
            -DSOLARPILOT_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89
          cmake --build build/package-cuda --target solarpilot --config Release --parallel 4
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          cpack --config build/package-cuda/CPackConfig.cmake -C Release
          archive=(build/package-cuda/packages/hermite-optics-local-*-cuda13.0-sm89.tar.gz)
          test "${#archive[@]}" -eq 1
          python scripts/verify_package.py "${archive[0]}"
