name: Validate · macOS · CPU

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Optional Build Run ID (blank selects the latest successful Build)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
      attempt: ${{ steps.build.outputs.attempt }}
      revision: ${{ steps.build.outputs.revision }}
      artifact_ids: ${{ steps.build.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/resolve-package
        with:
          build_run_id: ${{ inputs.build_run_id }}
          workflow: build-macos-cpu.yml

  runtime:
    name: runtime (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, platform: macos-x86_64, python_arch: x64 }
          - { runner: macos-15, platform: macos-arm64, python_arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/validate-package
        with:
          platform: ${{ matrix.platform }}
          backend: cpu
          run_id: ${{ needs.resolve.outputs.run_id }}
          attempt: ${{ needs.resolve.outputs.attempt }}
          revision: ${{ needs.resolve.outputs.revision }}
          artifact_id: ${{ fromJSON(needs.resolve.outputs.artifact_ids)[matrix.platform] }}
          python_arch: ${{ matrix.python_arch }}
