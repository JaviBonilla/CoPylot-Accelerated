name: Validate one downloaded package
description: Download the selected immutable artifact and test its binary
inputs:
  platform:
    description: Package OS and architecture
    required: true
  backend:
    description: Package backend
    default: cpu
  python_arch:
    description: Python architecture on the runner
    default: x64
  run_id:
    description: Selected run ID
    required: true
  attempt:
    description: Selected run attempt
    required: true
  revision:
    description: Full build revision
    required: true
  artifact_id:
    description: Immutable artifact ID selected by the resolver
    required: true
  gpu:
    description: Execute the Linux CUDA package on a GPU
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.revision }}
        path: build/selected-source
        persist-credentials: false
    - uses: actions/download-artifact@v7
      with:
        github-token: ${{ github.token }}
        run-id: ${{ inputs.run_id }}
        artifact-ids: ${{ inputs.artifact_id }}
        path: build/selected-artifact
    - if: runner.os != 'Linux' || inputs.gpu == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        architecture: ${{ inputs.python_arch }}
    - if: runner.os != 'Linux' || inputs.gpu == 'true'
      shell: bash
      run: |
        python -m pip install --only-binary=:all: -r build/selected-source/requirements.txt
    - name: Verify identity, checksum and extracted package
      shell: bash
      env:
        PACKAGE_PLATFORM: ${{ inputs.platform }}
        PACKAGE_BACKEND: ${{ inputs.backend }}
        BUILD_REVISION: ${{ inputs.revision }}
        BUILD_RUN_ID: ${{ inputs.run_id }}
        BUILD_ATTEMPT: ${{ inputs.attempt }}
        RUN_GPU: ${{ inputs.gpu }}
        PACKAGE_SOURCE_DIRECTORY: build/selected-source
      run: |
        directory=build/selected-artifact
        args=(--revision "$BUILD_REVISION" --run-id "$BUILD_RUN_ID" --run-attempt "$BUILD_ATTEMPT")
        if [[ "$RUNNER_OS" == Linux ]]; then
          operation=validate
          if [[ "$RUN_GPU" == true ]]; then operation=validate-gpu; fi
          scripts/package_linux_ci.sh "$operation" "$PACKAGE_BACKEND" "$directory" "${args[@]}"
        else
          python scripts/native_package.py validate --directory "$directory" \
            --platform "$PACKAGE_PLATFORM" --backend "$PACKAGE_BACKEND" \
            --source-directory "$PACKAGE_SOURCE_DIRECTORY" "${args[@]}"
        fi
    - name: Record the validated archive identity
      if: inputs.gpu != 'true'
      shell: bash
      env:
        PACKAGE_PLATFORM: ${{ inputs.platform }}
        PACKAGE_BACKEND: ${{ inputs.backend }}
        BUILD_REVISION: ${{ inputs.revision }}
        BUILD_RUN_ID: ${{ inputs.run_id }}
        BUILD_ATTEMPT: ${{ inputs.attempt }}
        BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then
          python3 scripts/release_pipeline.py receipt
        else
          python scripts/release_pipeline.py receipt
        fi
    - name: Upload package validation evidence
      if: inputs.gpu != 'true'
      uses: actions/upload-artifact@v6
      with:
        name: package-validation-${{ inputs.backend }}-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/package-validation/validation.json
        if-no-files-found: error
