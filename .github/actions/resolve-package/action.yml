name: Resolve the selected package build
description: Check the source workflow and resolve the successful run attempt
inputs:
  build_run_id:
    description: Optional Build Run ID. Leave blank for the latest successful Build.
    default: ""
  workflow:
    description: Expected build workflow filename
    required: true
outputs:
  run_id:
    description: Selected run ID
    value: ${{ steps.build.outputs.run_id }}
  attempt:
    description: Successful attempt number
    value: ${{ steps.build.outputs.attempt }}
  revision:
    description: Full source revision
    value: ${{ steps.build.outputs.revision }}
  artifact_ids:
    description: Artifact IDs keyed by platform
    value: ${{ steps.build.outputs.artifact_ids }}
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        BUILD_WORKFLOW: ${{ inputs.workflow }}
      run: python3 scripts/resolve_package.py
