name: Build and upload one package
description: Build and structurally verify a CPack artifact
inputs:
  platform:
    description: Package OS and architecture
    required: true
  backend:
    description: Package backend
    default: cpu
  python_arch:
    description: Python architecture for Windows and macOS
    default: x64
runs:
  using: composite
  steps:
    - if: runner.os != 'Linux'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        architecture: ${{ inputs.python_arch }}
    - if: runner.os != 'Linux'
      shell: bash
      run: python -m pip install cmake==3.30.5 ninja==1.11.1.4
    - name: Compile, package and check the archive
      shell: bash
      env:
        PACKAGE_PLATFORM: ${{ inputs.platform }}
        PACKAGE_BACKEND: ${{ inputs.backend }}
      run: |
        args=(--revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")
        if [[ "$RUNNER_OS" == Linux ]]; then
          scripts/package_linux_ci.sh build "$PACKAGE_BACKEND" "${args[@]}"
        else
          python scripts/native_package.py build --platform "$PACKAGE_PLATFORM" \
            --backend "$PACKAGE_BACKEND" "${args[@]}"
        fi
    - uses: actions/upload-artifact@v6
      with:
        name: hermite-optics-${{ inputs.backend }}-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/native-package/artifact/
        if-no-files-found: error
        compression-level: 0
    - name: Upload native build diagnostics
      if: failure() && runner.os != 'Linux'
      uses: actions/upload-artifact@v6
      with:
        name: hermite-optics-diagnostics-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/native-package/diagnostics/*.log
        if-no-files-found: ignore
